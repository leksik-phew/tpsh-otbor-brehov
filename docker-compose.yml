services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      PGPASSWORD: postgres
    command: >
      bash -lc
      "psql -h db -U postgres -d postgres -f /migrations/001_init.sql"

  loader:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      JSON_PATH: /app/data/videos.json
    command: ["python", "scripts/load_json.py"]
    volumes:
      - ./data:/app/data:ro

  bot:
    build: .
    depends_on:
      loader:
        condition: service_completed_successfully
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    restart: unless-stopped

volumes:
  pgdata: